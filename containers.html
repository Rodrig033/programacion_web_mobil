<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contenedores HTML</title>
</head>

<body>

    <div>
        <h1>Página web</h1>
        <p>Bienvenidos.</p>

        <img src="imagen.jpg" alt="Imagen de ejemplo"><!--agregar imagen-->

        <button>Haz clic aquí</button>
    </div>

    <nav>
        <a href="index.html">Inicio</a> <!--agregar pagina y contenido-->
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <div>
        <h2>Productos</h2>

        <div>
            <h3>Producto 1</h3>
            <p>Precio: $100</p>
            <button>Comprar</button>
        </div>

        <div>
            <h3>Producto 2</h3>
            <p>Precio: $200</p>
            <button>Comprar</button>
        </div>
    </div>

</body>
</html>

<!--<div>   Es un contenedor utilizado para agrupar otros elementos HTML. 
alt Es un atributo de <img> que proporciona un texto alternativo para la imagen, útil si esta no puede cargarse y para accesibilidad.
<button>    Crea un botón que el usuario puede pulsar.
<nav>   Representa una sección de navegación, normalmente contiene enlaces hacia otras páginas o secciones.
<a> Crea un enlace que permite al usuario ir a otra página o ubicación.
href    Es un atributo de <a> que indica la dirección de destino del enlace. -->
