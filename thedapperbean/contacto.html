    <div>
        <h1>¡Contactanos!</h1>

        <p>¿Tienes alguna pregunta? Ponte en contacto con nosotros.</p>

        <form>

            <label>Nombre:</label>
            <input type="text">
            <br><br>

            <label>Correo electrónico:</label>
            <input type="email">
            <br><br>

            <label>Teléfono:</label>
            <input type="tel">
            <br><br>

            <label>Mensaje:</label>
            <br>
            <textarea rows="5" cols="40"></textarea>
            <br><br>

            <button type="submit">Enviar</button>

        </form>
    </div>
