<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero Automático</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="atm">

        <!-- Pantalla -->
        <div class="pantalla-panel">

            <div class="botones-laterales">
                <button class="btn-lateral" onclick="presionarLateral(1)"></button>
                <button class="btn-lateral" onclick="presionarLateral(2)"></button>
                <button class="btn-lateral" onclick="presionarLateral(3)"></button>
                <button class="btn-lateral" onclick="presionarLateral(4)"></button>
            </div>

            <div class="pantalla" id="pantalla">
                BIENVENIDO
                <br>
                <small>Presione cualquier botón.</small>

            </div>

            <div class="botones-laterales">
                <button class="btn-lateral" onclick="presionarLateral(5)"></button>
                <button class="btn-lateral" onclick="presionarLateral(6)"></button>
                <button class="btn-lateral" onclick="presionarLateral(7)"></button>
                <button class="btn-lateral" onclick="presionarLateral(8)"></button>
            </div>

        </div>

        <!-- Ranuras -->
        <div class="zona-media">

            <div class="tarjeta">
                <div class="slot-tarjeta"></div>
            </div>

            <div class="recibo">
                <div class="slot-recibo"></div>
            </div>

        </div>

        <!-- Teclado -->
        <div class="teclado">

            <div class="num" onclick="presionarNumero('1')">1</div>
            <div class="num" onclick="presionarNumero('2')">2</div>
            <div class="num" onclick="presionarNumero('3')">3</div>
            <div class="funcion rojo" onclick="cancelar()" title="Cancelar"></div>

            <div class="num" onclick="presionarNumero('4')">4</div>
            <div class="num" onclick="presionarNumero('5')">5</div>
            <div class="num" onclick="presionarNumero('6')">6</div>
            <div class="funcion amarillo" onclick="borrar()" title="Borrar"></div>

            <div class="num" onclick="presionarNumero('7')">7</div>
            <div class="num" onclick="presionarNumero('8')">8</div>
            <div class="num" onclick="presionarNumero('9')">9</div>
            <div class="funcion verde" onclick="confirmar()" title="Confirmar"></div>

            <div class="num"></div>
            <div class="num" onclick="presionarNumero('0')">0</div>
            <div class="num"></div>
            <div class="funcion"></div>

        </div>

        <!-- Salida de efectivo -->
        <div class="dinero">
            <div class="slot-dinero"></div>
        </div>

    </div>
<script src="cajero.js"></script>


</body>
</html>
