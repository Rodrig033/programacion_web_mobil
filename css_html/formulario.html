<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos_formularios.css">
</head>
<body>
    

    <div class="contenedor">
    <h1>Formulario de registro</h1>

    <form action=""></form>
    <label>Nombre:</label>
    <input type="text" name="nombre" placeholder="Escribe tu nombre">

    <label>Apellido:</label>
    <input type="text" name="apellido" placeholder="Escribe tu apellido">

    <label>Correo electrónico:</label>
    <input type="email" name="correo" placeholder="ejemplo@correo.com">

    <label>Teléfono:</label>
    <input type="number" name="telefono" placeholder="10 dígitos">

    <label>Fecha de nacimiento:</label>
    <input type="date" name="nacimiento">

    <br>

    <label>Género:</label> 
    <select name="sexo">
        <option value="opcion">Selecciona una opción</option>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
        <option value="otros">Otros</option>
    </select>

    <label>Mensaje:</label>
    <textarea placeholder="Escribe un mensaje" rows="5" cols="20"></textarea>

    <br>

    <div class="checkbox">
    <input type="checkbox" value="Acepto términos y condiciones"><span>Acepto los terminos y condiciones</span>
    </div>

    <br>

    <button type="submit" aria-placeholder="Enviar formulario">Enviar formulario</button>


    </div>   

</body>
</html>
