<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        table {
            border-collapse: collapse; /* Une los bordes de las celdas */
            width: 100%;
        }
        th, td {
            border: 1px solid #000000; /* Define el borde negro de 1 píxel */
            padding: 8px;              /* Espacio interno en las celdas */
            text-align: center;          /* Alineación del texto */
        }
        th {
            background-color: #f2f2f2; /* Color de fondo para los encabezados */
        }
    </style>

</head>
<body>

    <table>
       <tr>
        <th>Nombre</th> <!--Table Header-->
        <th>Edad</th>
        <th>Ciudad</th>
       </tr>

       <tr>
        <td>Rodrigo</td>
        <td>21</td>
        <td>Xalapa</td>
       </tr>

       <tr>
        <td>Sergio</td>
        <td>40</td>
        <td>Guadalajara</td>
       </tr>

       <tr>
        <td>Jannik</td>
        <td>23</td>
        <td>Roma</td>
       </tr>

    </table>

</body>
</html>
