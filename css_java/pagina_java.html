<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Java</title>
    <link rel="stylesheet" type="text/css" href="estilos.css">
</head>
<body>

    <h1>[thefacebook]</h1>
    <p id="mensaje">¡Bienvenido a la página oficial!</p>
    <button onclick="cambiarTexto()"> Haz click aquí </button>
    <p id="1"></p>
    <button onclick="cambiarNumero1()"> Descubre el numero </button>
    <p id="2"></p>
    <button onclick="cambiarNumero2()"> Descubre el numero </button>


    <div class="calculadora">
        <input type="text" id="pantalla" value="0" disabled>

        <div class="botones">
            <button class="limpiar">C</button>
            <button>/</button>
            <button>*</button>
            <button class="borrar">←</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="igual">=</button>

            <button class="cero">0</button>
            <button>.</button>
        </div>
    </div>

    <script src="boton.js"></script>


</body>
</html>
