<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" type="text/css" href="estilos_calculadora.css">

</head>
<body>

     <div class="calculadora">
        <input type="text" id="pantalla" value="0" disabled>

        <button class="resultado">Resultado</button>

        <div class="botones">
            <button class="limpiar">C</button>
            <button>/</button>
            <button>*</button>
            <button class="borrar">←</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="igual">=</button>

            <button class="cero">0</button>
            <button>.</button>
        </div>
    </div>
    
</body>
</html>
